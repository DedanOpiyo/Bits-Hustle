version: '3.8'

services:
  # Flask API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bitshustle-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./flask-api/.env
    depends_on:
      - db
    environment:
      - FLASK_ENV=production
    volumes:
      - ./flask-api/uploads:/app/uploads
    networks:
      - app-network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bitshustle-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=https://api.bitshustlehubs.co.ke/api
    networks:
      - app-network
    depends_on:
      - backend

  # MariaDB Database
  db:
    image: mariadb:10.11
    container_name: bitshustle-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  # Redis (for future background tasks)
  redis:
    image: redis:7-alpine
    container_name: bitshustle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge