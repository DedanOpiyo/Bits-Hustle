# Combined Nginx Configuration for Same-Domain Hosting
# Frontend: bitshustlehubs.co.ke (served from /usr/share/nginx/html)
# Backend API can be accessed via /api proxy or api.bitshustlehubs.co.ke

# Frontend server (main domain)
server {
    listen 80;
    listen 443 ssl http2;
    server_name bitshustlehubs.co.ke www.bitshustlehubs.co.ke;

    # SSL certificates (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/bitshustlehubs.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitshustlehubs.co.ke/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend subdomain
    location /api/ {
        proxy_pass https://api.bitshustlehubs.co.ke/api/;
        proxy_set_header Host api.bitshustlehubs.co.ke;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Backend API subdomain
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.bitshustlehubs.co.ke;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api.bitshustlehubs.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bitshustlehubs.co.ke/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Flask/Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# HTTP redirect to HTTPS (both domains)
server {
    listen 80;
    server_name bitshustlehubs.co.ke www.bitshustlehubs.co.ke api.bitshustlehubs.co.ke;
    return 301 https://$server_name$request_uri;
}